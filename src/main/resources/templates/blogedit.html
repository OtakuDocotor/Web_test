<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <title> Edit Blog </title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <header th:insert="~{blocks/header :: header}"/>
    <div class="container mt-5 mb-5">
        <h1>Редактирование статьи</h1>
        <div th:each="el : ${article}">
            <form method="post">
                <input type="text" th:value="${el._Title}" name="title" placeholder="Введите название статьи" class="form-control"><br>
                <input type="text" th:value="${el._Anons}" name="anons" placeholder="Введите анонс" class="form-control"><br>
                <textarea name="full_text" placeholder="Введите текст" class="form-control" th:text="${el._Text}"/><br>
                <button type="submit" class="btn btn-success">Обновить</button>
            </form>
        </div>
    </div>
    <div th:insert="~{blocks/footer :: footer}"/>
</body>
</html>
