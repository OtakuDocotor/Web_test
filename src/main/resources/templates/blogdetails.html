<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <title> This is Blog </title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <header th:insert="~{blocks/header :: header}"/>
    <div class="container mt-5">
        <div th:each="el : ${article}" class="alert alert-info mt-2">
            <h1 th:text="${el._Title}"/>
            <p th:text="${el._Text}"/>
            <p><b>Просмотров: </b> <span th:text="${el.views}"/></p>
            <a th:href="'/blog/' + ${el._Id}+'/edit'" class="btn btn-warning">Редактировать</a>
            <form th:action="'/blog/'+${id}+'/delete'" method="post">
                <button class="btn btn-warning" type="submit">Удалить</button>
            </form>
        </div>
    </div>
    <div th:insert="~{blocks/footer :: footer}"/>
</body>
</html>
